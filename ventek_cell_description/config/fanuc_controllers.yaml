controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    fanuc_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    cell_door_controller:
      type: position_controllers/JointGroupPositionController

fanuc_arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

    gains:
      joint_1: {p: 12000.0, d: 200.0, i: 10.0}
      joint_2: {p: 14000.0, d: 250.0, i: 15.0}
      joint_3: {p: 10000.0, d: 180.0, i: 10.0}
      joint_4: {p: 5000.0, d: 80.0, i: 5.0}
      joint_5: {p: 4000.0, d: 60.0, i: 5.0}
      joint_6: {p: 2000.0, d: 30.0, i: 2.0}

cell_door_controller:
  ros__parameters:
    joints:
      - cell_door_joint
